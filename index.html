<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Throw a Coin — Collection Index Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --header-bg: #0f172a;
      --table-header-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;
      --success-border: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* ✨ 華麗頂部標題與頭像動畫特效 */
    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f43f5e, #fde047, #38bdf8);
      background-size: 300% 300%;
      animation: avatarGradient 4s linear infinite, avatarGlow 2.5s ease-in-out infinite alternate;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #0f172a;
      display: block;
    }

    @keyframes avatarGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes avatarGlow {
      0% {
        box-shadow: 0 0 8px rgba(129, 140, 248, 0.6), 0 0 15px rgba(192, 132, 252, 0.4);
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 18px rgba(244, 63, 94, 0.8), 0 0 28px rgba(56, 189, 248, 0.6);
        transform: scale(1.04);
      }
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(
        120deg, 
        #818cf8 0%, 
        #c084fc 25%, 
        #f43f5e 50%, 
        #fde047 75%, 
        #38bdf8 100%
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradientFlow 6s ease infinite, titleGlowPulse 2.5s ease-in-out infinite alternate;
      position: relative;
      display: inline-block;
    }

    @keyframes titleGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes titleGlowPulse {
      0% {
        filter: drop-shadow(0 0 5px rgba(129, 140, 248, 0.4)) 
                drop-shadow(0 0 12px rgba(192, 132, 252, 0.3));
      }
      100% {
        filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.7)) 
                drop-shadow(0 0 25px rgba(56, 189, 248, 0.6))
                drop-shadow(0 0 35px rgba(253, 224, 71, 0.4));
      }
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .auth-status {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #334155; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-warning { background-color: #eab308; color: #0f172a; }
    .btn-warning:hover { background-color: #ca8a04; }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-success { background-color: #10b981; color: #fff; }
    .btn-success:hover { background-color: #059669; }

    .btn-roblox {
      background: linear-gradient(135deg, #00a2ff, #0066ff);
      color: #fff;
    }
    .btn-roblox:hover {
      background: linear-gradient(135deg, #0088cc, #0044cc);
      box-shadow: 0 0 12px rgba(0, 162, 255, 0.5);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
      min-width: 200px;
    }
    .search-input:focus { border-color: var(--accent); }

    .view-toggle-container {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .admin-only {
      display: none;
    }

    body:not(.read-only) .admin-only {
      display: inline-flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-container {
      overflow-x: auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-height: 75vh;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #1e293b;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    td {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }

    .item-img-container {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease-in-out;
    }

    .item-img-container:hover .item-img {
      transform: scale(1.4);
      z-index: 20;
    }

    .img-placeholder {
      font-size: 0.8rem;
      color: #475569;
      text-align: center;
    }

    body:not(.read-only) .editable-cell:hover {
      background-color: rgba(99, 102, 241, 0.15);
      cursor: pointer;
    }

    .rarity-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      text-transform: capitalize;
    }

    .rarity-common { color: #9e9e9e; background: rgba(158, 158, 158, 0.15); border: 1px solid #616161; }
    .rarity-uncommon { color: #4caf50; background: rgba(76, 175, 80, 0.15); border: 1px solid #388e3c; }
    .rarity-rare { color: #2196f3; background: rgba(33, 150, 243, 0.15); border: 1px solid #1976d2; }
    .rarity-epic { color: #ab47bc; background: rgba(171, 71, 188, 0.15); border: 1px solid #7b1fa2; }
    .rarity-legendary { color: #ffa726; background: rgba(255, 167, 38, 0.15); border: 1px solid #f57c00; }
    .rarity-chronal { color: #00bcd4; background: rgba(0, 188, 212, 0.15); border: 1px solid #0097a7; }
    .rarity-carved { color: #8d6e63; background: rgba(141, 110, 99, 0.15); border: 1px solid #5d4037; }
    .rarity-honed { color: #78909c; background: rgba(120, 144, 156, 0.15); border: 1px solid #455a64; }
    .rarity-tempered { color: #26a69a; background: rgba(38, 166, 154, 0.15); border: 1px solid #00796b; }
    .rarity-yokai { color: #3b82f6; background: rgba(59, 130, 246, 0.15); border: 1px solid #1d4ed8; }
    .rarity-veiled { color: #a855f7; background: rgba(168, 85, 247, 0.15); border: 1px solid #6b21a8; }
    .rarity-hallowed { color: #ec4899; background: rgba(236, 72, 153, 0.15); border: 1px solid #be185d; }
    .rarity-imperial { color: #f59e0b; background: rgba(245, 158, 11, 0.2); border: 1px solid #d97706; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }

    .status-cell {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .badge-empty { color: #475569; }
    .badge-collected {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .count-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .count-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
      font-weight: bold;
      line-height: 1;
    }

    body:not(.read-only) .count-box:hover .count-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    body.read-only .status-cell,
    body.read-only .count-box,
    body.read-only .editable-cell {
      pointer-events: none;
    }

    /* 卡牌檢視 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
      padding: 4px 0;
    }

    .item-card {
      position: relative;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .item-card:hover { transform: translateY(-5px); }

    .item-card.locked {
      opacity: 0.6;
      background: #0d1322;
      border-color: #1e293b;
    }

    .card-img-wrapper {
      position: relative;
      width: 100%;
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 8px;
      margin: 8px 0;
      overflow: hidden;
    }

    .card-img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .card-id {
      font-size: 0.75rem;
      color: var(--text-muted);
      align-self: flex-start;
      font-weight: 700;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 2px 0;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .trade-modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 90%;
      max-width: 650px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .trade-textarea {
      width: 100%;
      height: 220px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #38bdf8;
      font-family: monospace;
      padding: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      margin-bottom: 16px;
    }
  </style>
</head>

    const searchInput = document.getElementById("search-input");
    const btnViewTable = document.getElementById("btn-view-table");
    const btnViewCard = document.getElementById("btn-view-card");

    const addItemBtn = document.getElementById("add-item-btn");
    const deleteItemBtn = document.getElementById("delete-item-btn");

    function render() {
      const query = searchInput.value.toLowerCase().trim();
      tbody.innerHTML = "";
      cardContainer.innerHTML = "";

      let astralCountSum = 0;
      let astralCollected = 0;
      let divineCollected = 0;
      let voidCollected = 0;

      const sortedKeys = Object.keys(itemsData).sort((a, b) => itemsData[a].id - itemsData[b].id);
      const totalCount = sortedKeys.length;

      sortedKeys.forEach(key => {
        const item = itemsData[key];

        if (item.astral) astralCollected++;
        if (item.divine) divineCollected++;
        if (item.void) voidCollected++;
        astralCountSum += (item.astralCount || 0);

        const matchSearch = item.name.toLowerCase().includes(query) || String(item.id).includes(query);
        if (!matchSearch) return;

        const safeRarityName = item.rarity ? item.rarity.toLowerCase().replace(/[^a-z0-9]/g, '\\$&') : 'common';
        const rarityClass = `rarity-${safeRarityName}`;

        // 1. 渲染表格列
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>#${item.id}</strong></td>
          <td class="editable-cell" data-action="edit-name" data-key="${key}" title="登入後雙擊修改名稱"><strong>${item.name}</strong></td>
          <td class="editable-cell" data-action="edit-img" data-key="${key}" style="text-align: left; padding-left: 10px;" title="登入後雙擊設定圖片網址">
            <div class="item-img-container">
              ${item.imageUrl ? `<img src="${item.imageUrl}" class="item-img" alt="${item.name}">` : `<span class="img-placeholder">+圖片</span>`}
            </div>
          </td>
          <td class="editable-cell" data-action="edit-rarity" data-key="${key}" title="登入後雙擊修改稀有度">
            <span class="rarity-tag ${rarityClass}">${item.rarity}</span>
          </td>
          <td class="status-cell" data-action="toggle-astral" data-key="${key}">
            <span class="badge ${item.astral ? 'badge-collected' : 'badge-empty'}">${item.astral ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="status-cell">
            <div class="count-box">
              <button class="count-btn" data-action="adjust-count" data-key="${key}" data-val="-1">-</button>
              <span data-action="direct-count" data-key="${key}" style="min-width: 24px; text-align: center;">${item.astralCount || 0}</span>
              <button class="count-btn" data-action="adjust-count" data-key="${key}" data-val="1">+</button>
            </div>
          </td>
          <td class="status-cell" data-action="toggle-divine" data-key="${key}">
            <span class="badge ${item.divine ? 'badge-collected' : 'badge-empty'}">${item.divine ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="status-cell" data-action="toggle-void" data-key="${key}">
            <span class="badge ${item.void ? 'badge-collected' : 'badge-empty'}">${item.void ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="admin-only" style="text-align: center;">
            <button class="btn btn-danger" data-action="delete-single" data-key="${key}" style="padding: 2px 8px; font-size: 0.75rem;">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);

        // 2. 渲染卡牌
        const card = document.createElement("div");
        const isUnlocked = item.astral || item.divine || item.void || (item.astralCount > 0);
        card.className = `item-card ${isUnlocked ? 'unlocked' : 'locked'}`;
        card.innerHTML = `
          <div class="card-id">#${item.id}</div>
          <div class="card-title">${item.name}</div>
          <div class="card-img-wrapper">
            ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img" alt="${item.name}">` : `<span class="img-placeholder">無圖片</span>`}
          </div>
          <span class="rarity-tag ${rarityClass}">${item.rarity}</span>
        `;
        cardContainer.appendChild(card);
      });

      // 更新進度卡片
      document.getElementById("stat-astral").innerText = `${astralCollected} / ${totalCount} (${Math.round((astralCollected / totalCount) * 100 || 0)}%)`;
      document.getElementById("stat-divine").innerText = `${divineCollected} / ${totalCount} (${Math.round((divineCollected / totalCount) * 100 || 0)}%)`;
      document.getElementById("stat-void").innerText = `${voidCollected} / ${totalCount} (${Math.round((voidCollected / totalCount) * 100 || 0)}%)`;
      document.getElementById("stat-count-total").innerText = astralCountSum;
    }

    // 事件委派：點擊與雙擊操作
    tbody.addEventListener("click", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target || document.body.classList.contains("read-only")) return;

      const action = target.dataset.action;
      const key = target.dataset.key;

      if (action === "toggle-astral") toggleStatus(key, "astral");
      if (action === "toggle-divine") toggleStatus(key, "divine");
      if (action === "toggle-void") toggleStatus(key, "void");
      if (action === "adjust-count") adjustCount(key, parseInt(target.dataset.val));
      if (action === "direct-count") editCountDirect(key);
      if (action === "delete-single") deleteSingleItem(key);
    });

    tbody.addEventListener("dblclick", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target || document.body.classList.contains("read-only")) return;

      const action = target.dataset.action;
      const key = target.dataset.key;

      if (action === "edit-name") editField(key, "name");
      if (action === "edit-img") editField(key, "imageUrl");
      if (action === "edit-rarity") editField(key, "rarity");
    });

    // 編輯欄位
    function editField(key, field) {
      const currentVal = itemsData[key][field] || "";
      const newVal = prompt(`請輸入新的 ${field}：`, currentVal);
      if (newVal !== null) {
        itemsData[key][field] = newVal.trim();
        saveData();
      }
    }

    // 切換狀態
    function toggleStatus(key, field) {
      itemsData[key][field] = !itemsData[key][field];
      saveData();
    }

    // 調整數量
    function adjustCount(key, delta) {
      const current = itemsData[key].astralCount || 0;
      itemsData[key].astralCount = Math.max(0, current + delta);
      saveData();
    }

    function editCountDirect(key) {
      const current = itemsData[key].astralCount || 0;
      const newVal = prompt("請直接輸入 Astral 數量：", current);
      if (newVal !== null && !isNaN(newVal)) {
        itemsData[key].astralCount = Math.max(0, parseInt(newVal));
        saveData();
      }
    }

    // ➕ 動態新增列 (Item)
    addItemBtn.addEventListener("click", () => {
      const keys = Object.keys(itemsData).map(k => itemsData[k].id);
      const nextId = keys.length > 0 ? Math.max(...keys) + 1 : 1;

      const name = prompt(`請輸入新物品 (ID #${nextId}) 的名稱：`, `物品 #${nextId}`);
      if (!name) return;

      const rarity = prompt("請輸入稀有度 (例如: Common, Rare, Imperial...):", "Common") || "Common";

      itemsData[`item_${nextId}`] = {
        id: nextId,
        name: name,
        rarity: rarity,
        imageUrl: "",
        astral: false,
        astralCount: 0,
        divine: false,
        void: false
      };

      saveData();
    });

    // 🗑️ 刪除最後一列
    deleteItemBtn.addEventListener("click", () => {
      const keys = Object.keys(itemsData).sort((a, b) => itemsData[a].id - itemsData[b].id);
      if (keys.length === 0) return alert("目前已無任何物品可刪除！");

      const lastKey = keys[keys.length - 1];
      if (confirm(`確定要刪除最後一項物品 [#${itemsData[lastKey].id} ${itemsData[lastKey].name}] 嗎？`)) {
        delete itemsData[lastKey];
        saveData();
      }
    });

    // 刪除指定列
    function deleteSingleItem(key) {
      if (confirm(`確定刪除 [#${itemsData[key].id} ${itemsData[key].name}] 嗎？`)) {
        delete itemsData[key];
        saveData();
      }
    }

    // 資料儲存與同步 (Firebase)
    function saveData() {
      render();
      setDoc(doc(db, "trackers", "main_tracker"), { items: itemsData }, { merge: true })
        .catch(err => console.error("雲端同步失敗：", err));
    }

    // 即時監聽 Firestore
    onSnapshot(doc(db, "trackers", "main_tracker"), (snapshot) => {
      if (snapshot.exists() && snapshot.data().items) {
        itemsData = snapshot.data().items;
        render();
      }
    });

    // 管理員登入切換
    authBtn.addEventListener("click", () => {
      if (auth.currentUser) {
        signOut(auth);
      } else {
        const email = prompt("請輸入管理員 Email：");
        const password = prompt("請輸入密碼：");
        if (email && password) {
          signInWithEmailAndPassword(auth, email, password)
            .catch(err => alert("登入失敗：" + err.message));
        }
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.body.classList.remove("read-only");
        authStatus.innerText = "當前狀態：管理員已登入";
        authBtn.innerText = "登出";
      } else {
        document.body.classList.add("read-only");
        authStatus.innerText = "當前狀態：瀏覽模式 (唯讀)";
        authBtn.innerText = "管理員登入";
      }
      render();
    });

    // 切換視圖
    btnViewTable.addEventListener("click", () => {
      btnViewTable.classList.add("active");
      btnViewCard.classList.remove("active");
      tableViewContainer.style.display = "block";
      cardContainer.style.display = "none";
    });

    btnViewCard.addEventListener("click", () => {
      btnViewCard.classList.add("active");
      btnViewTable.classList.remove("active");
      tableViewContainer.style.display = "none";
      cardContainer.style.display = "grid";
    });

    // 搜尋過濾
    searchInput.addEventListener("input", render);

    render();
  </script>
</body>
</html>
