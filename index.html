<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Throw a Coin — Collection Index Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --header-bg: #0f172a;
      --table-header-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success-bg: rgba(16, 185, 129, 0.15);
      --success-text: #34d399;
      --success-border: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #818cf8, #c084fc, #f43f5e, #fde047, #38bdf8);
      background-size: 300% 300%;
      animation: avatarGradient 4s linear infinite, avatarGlow 2.5s ease-in-out infinite alternate;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #0f172a;
      display: block;
    }

    @keyframes avatarGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes avatarGlow {
      0% {
        box-shadow: 0 0 8px rgba(129, 140, 248, 0.6), 0 0 15px rgba(192, 132, 252, 0.4);
        transform: scale(1);
      }
      100% {
        box-shadow: 0 0 18px rgba(244, 63, 94, 0.8), 0 0 28px rgba(56, 189, 248, 0.6);
        transform: scale(1.04);
      }
    }

    .title-group h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(
        120deg, 
        #818cf8 0%, 
        #c084fc 25%, 
        #f43f5e 50%, 
        #fde047 75%, 
        #38bdf8 100%
      );
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGradientFlow 6s ease infinite, titleGlowPulse 2.5s ease-in-out infinite alternate;
    }

    @keyframes titleGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes titleGlowPulse {
      0% { filter: drop-shadow(0 0 5px rgba(129, 140, 248, 0.4)); }
      100% { filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.7)); }
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .auth-status {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: #334155; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-warning { background-color: #eab308; color: #0f172a; }
    .btn-danger { background-color: #ef4444; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-success { background-color: #10b981; }
    .btn-success:hover { background-color: #059669; }

    .btn-roblox {
      background: linear-gradient(135deg, #00a2ff, #0066ff);
      color: #fff;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .stat-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      flex: 1;
      min-width: 200px;
    }

    .view-toggle-container {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .view-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .admin-only { display: none; }
    body:not(.read-only) .admin-only { display: inline-flex; gap: 8px; flex-wrap: wrap; }

    .table-container {
      overflow-x: auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-height: 75vh;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #1e293b;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
      white-space: nowrap;
    }

    td {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
      color: var(--text-main);
      vertical-align: middle;
      white-space: nowrap;
    }

    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }

    .item-img-container {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px dashed var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .img-placeholder {
      font-size: 0.75rem;
      color: #475569;
    }

    body:not(.read-only) .editable-cell:hover {
      background-color: rgba(99, 102, 241, 0.15);
      cursor: pointer;
    }

    .rarity-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .status-cell {
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge-empty { color: #475569; }
    .badge-collected {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .count-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .count-btn {
      background: #334155;
      color: #fff;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      cursor: pointer;
      display: none;
    }

    body:not(.read-only) .count-box:hover .count-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    body.read-only .status-cell,
    body.read-only .count-box,
    body.read-only .editable-cell { pointer-events: none; }

    /* 卡牌風格 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 18px;
    }

    .item-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .item-card.locked { opacity: 0.6; background: #0d1322; }

    .card-img-wrapper {
      width: 100%;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      border-radius: 8px;
      margin: 8px 0;
    }

    .card-img { max-width: 90%; max-height: 90%; object-fit: contain; }
    .card-id { font-size: 0.75rem; color: var(--text-muted); align-self: flex-start; }
    .card-title { font-size: 0.9rem; font-weight: 700; margin: 2px 0; }
  </style>
</head>
<body class="read-only">

  <header>
    <div class="title-group">
      <div class="avatar-wrapper">
        <img src="https://i.ibb.co/vv6Dd3qw/test22.png" alt="Avatar" class="avatar-img">
      </div>
      <h1>新竹九降風清水疾風俠 Roblox Throw a Coin — Collection Index Tracker</h1>
    </div>
    <div class="auth-box">
      <a href="https://www.roblox.com/users/10053396167/profile" target="_blank" class="btn btn-roblox">🎮 Roblox</a>
      <button class="btn btn-secondary" onclick="copyRobloxID()">📋 複製 ID</button>
      <span id="auth-status" class="auth-status">當前狀態：瀏覽模式 (唯讀)</span>
      <button id="auth-btn" class="btn">管理員登入</button>
    </div>
  </header>

  <div class="dashboard">
    <div class="stat-card"><div class="stat-title">Astral 收集進度</div><div id="stat-astral" class="stat-value">0 / 0 (0%)</div></div>
    <div class="stat-card"><div class="stat-title">Divine 收集進度</div><div id="stat-divine" class="stat-value">0 / 0 (0%)</div></div>
    <div class="stat-card"><div class="stat-title">Void 收集進度</div><div id="stat-void" class="stat-value">0 / 0 (0%)</div></div>
    <div class="stat-card"><div class="stat-title">Astral 總數量</div><div id="stat-count-total" class="stat-value">0</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="search-input" class="search-input" placeholder="搜尋物品名稱或編號...">
    
    <div class="view-toggle-container">
      <button id="btn-view-table" class="view-btn active">📊 表格</button>
      <button id="btn-view-card" class="view-btn">🎴 卡牌相簿</button>
    </div>

    <!-- 🛠️ 管理員增刪「列」與「欄」工具列 -->
    <div class="admin-only">
      <button id="add-item-btn" class="btn btn-success">➕ 新增物品 (列)</button>
      <button id="delete-item-btn" class="btn btn-danger">🗑️ 刪除最後一列</button>
      <button id="add-col-btn" class="btn btn-warning">➕ 新增欄位 (欄)</button>
      <button id="del-col-btn" class="btn btn-danger">🗑️ 刪除自訂欄位</button>
    </div>
  </div>

  <!-- 表格檢視 -->
  <div id="table-view-container" class="table-container">
    <table>
      <thead>
        <tr id="table-header-row">
          <th style="width: 70px;">編號</th>
          <th style="width: 140px;">物品名稱</th>
          <th style="width: 90px; text-align: center;">圖片</th>
          <th style="width: 120px;">稀有度</th>
          <th style="width: 110px; text-align: center;">ASTRAL</th>
          <th style="width: 120px; text-align: center;">ASTRAL COUNT</th>
          <th style="width: 110px; text-align: center;">DIVINE</th>
          <th style="width: 110px; text-align: center;">VOID</th>
          <!-- 動態欄位會插在這裡 -->
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- 卡牌檢視 -->
  <div id="card-view-container" class="card-grid" style="display: none;"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBh4wNEwXzGOxKOJqj3Akg7gj1WxFHzmNQ",
      authDomain: "throw-a-coin.firebaseapp.com",
      projectId: "throw-a-coin",
      storageBucket: "throw-a-coin.firebasestorage.app",
      messagingSenderId: "79225369395",
      appId: "1:79225369395:web:ac6b6dadb1154159c40446"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 預設預設欄位定義
    let customColumns = []; 
    let itemsData = {};

    // 建立 1 ~ 181 預設物品
    for (let i = 1; i <= 181; i++) {
      itemsData[`item_${i}`] = {
        id: i,
        name: `物品 #${i}`,
        rarity: `Common`,
        imageUrl: "",
        astral: false,
        astralCount: 0,
        divine: false,
        void: false,
        extraFields: {}
      };
    }

    const tbody = document.getElementById("table-body");
    const headerRow = document.getElementById("table-header-row");
    const cardContainer = document.getElementById("card-view-container");
    const searchInput = document.getElementById("search-input");
    const authBtn = document.getElementById("auth-btn");

    function render() {
      const query = searchInput.value.toLowerCase().trim();

      // 1. 渲染動態 Header 欄位
      headerRow.innerHTML = `
        <th style="width: 70px;">編號</th>
        <th style="width: 140px;">物品名稱</th>
        <th style="width: 90px; text-align: center;">圖片</th>
        <th style="width: 120px;">稀有度</th>
        <th style="width: 110px; text-align: center;">ASTRAL</th>
        <th style="width: 120px; text-align: center;">ASTRAL COUNT</th>
        <th style="width: 110px; text-align: center;">DIVINE</th>
        <th style="width: 110px; text-align: center;">VOID</th>
      `;

      customColumns.forEach(col => {
        const th = document.createElement("th");
        th.style.textAlign = "center";
        th.innerText = col.name.toUpperCase();
        headerRow.appendChild(th);
      });

      const adminActionTh = document.createElement("th");
      adminActionTh.className = "admin-only";
      adminActionTh.style.textAlign = "center";
      adminActionTh.innerText = "操作";
      headerRow.appendChild(adminActionTh);

      // 2. 渲染內容 (列)
      tbody.innerHTML = "";
      cardContainer.innerHTML = "";

      let astralCountSum = 0;
      let astralCollected = 0, divineCollected = 0, voidCollected = 0;

      const sortedKeys = Object.keys(itemsData).sort((a, b) => itemsData[a].id - itemsData[b].id);
      const totalCount = sortedKeys.length;

      sortedKeys.forEach(key => {
        const item = itemsData[key];
        if (!item.extraFields) item.extraFields = {};

        if (item.astral) astralCollected++;
        if (item.divine) divineCollected++;
        if (item.void) voidCollected++;
        astralCountSum += (item.astralCount || 0);

        if (!item.name.toLowerCase().includes(query) && !String(item.id).includes(query)) return;

        // 表格列渲染
        const tr = document.createElement("tr");
        let extraHtml = "";

        // 渲染自訂欄位內容
        customColumns.forEach(col => {
          const val = item.extraFields[col.key];
          if (col.type === "boolean") {
            extraHtml += `
              <td class="status-cell" data-action="toggle-custom" data-key="${key}" data-colkey="${col.key}">
                <span class="badge ${val ? 'badge-collected' : 'badge-empty'}">${val ? '✓ 已開啟' : '-'}</span>
              </td>`;
          } else {
            extraHtml += `
              <td class="status-cell">
                <div class="count-box">
                  <button class="count-btn" data-action="adjust-custom" data-key="${key}" data-colkey="${col.key}" data-val="-1">-</button>
                  <span data-action="direct-custom" data-key="${key}" data-colkey="${col.key}">${val || 0}</span>
                  <button class="count-btn" data-action="adjust-custom" data-key="${key}" data-colkey="${col.key}" data-val="1">+</button>
                </div>
              </td>`;
          }
        });

        tr.innerHTML = `
          <td><strong>#${item.id}</strong></td>
          <td class="editable-cell" data-action="edit-name" data-key="${key}"><strong>${item.name}</strong></td>
          <td class="editable-cell" data-action="edit-img" data-key="${key}" style="text-align: center;">
            <div class="item-img-container" style="margin: 0 auto;">
              ${item.imageUrl ? `<img src="${item.imageUrl}" class="item-img">` : `<span class="img-placeholder">+圖片</span>`}
            </div>
          </td>
          <td class="editable-cell" data-action="edit-rarity" data-key="${key}">
            <span class="rarity-tag">${item.rarity}</span>
          </td>
          <td class="status-cell" data-action="toggle-astral" data-key="${key}">
            <span class="badge ${item.astral ? 'badge-collected' : 'badge-empty'}">${item.astral ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="status-cell">
            <div class="count-box">
              <button class="count-btn" data-action="adjust-count" data-key="${key}" data-val="-1">-</button>
              <span data-action="direct-count" data-key="${key}">${item.astralCount || 0}</span>
              <button class="count-btn" data-action="adjust-count" data-key="${key}" data-val="1">+</button>
            </div>
          </td>
          <td class="status-cell" data-action="toggle-divine" data-key="${key}">
            <span class="badge ${item.divine ? 'badge-collected' : 'badge-empty'}">${item.divine ? '✓ 已收集' : '-'}</span>
          </td>
          <td class="status-cell" data-action="toggle-void" data-key="${key}">
            <span class="badge ${item.void ? 'badge-collected' : 'badge-empty'}">${item.void ? '✓ 已收集' : '-'}</span>
          </td>
          ${extraHtml}
          <td class="admin-only" style="text-align: center;">
            <button class="btn btn-danger" data-action="delete-single" data-key="${key}" style="padding: 2px 8px; font-size: 0.75rem;">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);

        // 卡牌渲染
        const card = document.createElement("div");
        card.className = `item-card ${item.astral || item.divine || item.void ? 'unlocked' : 'locked'}`;
        card.innerHTML = `
          <div class="card-id">#${item.id}</div>
          <div class="card-title">${item.name}</div>
          <div class="card-img-wrapper">
            ${item.imageUrl ? `<img src="${item.imageUrl}" class="card-img">` : `<span class="img-placeholder">無圖片</span>`}
          </div>
          <span class="rarity-tag">${item.rarity}</span>
        `;
        cardContainer.appendChild(card);
      });

      // 更新頂部數據
      document.getElementById("stat-astral").innerText = `${astralCollected} / ${totalCount} (${Math.round((astralCollected / totalCount) * 100 || 0)}%)`;
      document.getElementById("stat-divine").innerText = `${divineCollected} / ${totalCount} (${Math.round((divineCollected / totalCount) * 100 || 0)}%)`;
      document.getElementById("stat-void").innerText = `${voidCollected} / ${totalCount} (${Math.round((voidCollected / totalCount) * 100 || 0)}%)`;
      document.getElementById("stat-count-total").innerText = astralCountSum;
    }

    // 事件點擊監聽
    tbody.addEventListener("click", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target || document.body.classList.contains("read-only")) return;

      const action = target.dataset.action;
      const key = target.dataset.key;
      const colkey = target.dataset.colkey;

      if (action === "toggle-astral") { itemsData[key].astral = !itemsData[key].astral; saveData(); }
      if (action === "toggle-divine") { itemsData[key].divine = !itemsData[key].divine; saveData(); }
      if (action === "toggle-void") { itemsData[key].void = !itemsData[key].void; saveData(); }
      if (action === "adjust-count") { 
        itemsData[key].astralCount = Math.max(0, (itemsData[key].astralCount || 0) + parseInt(target.dataset.val)); 
        saveData(); 
      }
      if (action === "toggle-custom") {
        itemsData[key].extraFields[colkey] = !itemsData[key].extraFields[colkey];
        saveData();
      }
      if (action === "adjust-custom") {
        const cur = itemsData[key].extraFields[colkey] || 0;
        itemsData[key].extraFields[colkey] = Math.max(0, cur + parseInt(target.dataset.val));
        saveData();
      }
      if (action === "delete-single") {
        if (confirm(`確定刪除 [#${itemsData[key].id} ${itemsData[key].name}]？`)) {
          delete itemsData[key];
          saveData();
        }
      }
    });

    // 雙擊編輯
    tbody.addEventListener("dblclick", (e) => {
      const target = e.target.closest("[data-action]");
      if (!target || document.body.classList.contains("read-only")) return;

      const action = target.dataset.action;
      const key = target.dataset.key;

      if (action === "edit-name") {
        const val = prompt("請輸入新名稱：", itemsData[key].name);
        if (val !== null) { itemsData[key].name = val.trim(); saveData(); }
      }
      if (action === "edit-img") {
        const val = prompt("請輸入圖片網址 (URL)：", itemsData[key].imageUrl);
        if (val !== null) { itemsData[key].imageUrl = val.trim(); saveData(); }
      }
      if (action === "edit-rarity") {
        const val = prompt("請輸入稀有度：", itemsData[key].rarity);
        if (val !== null) { itemsData[key].rarity = val.trim(); saveData(); }
      }
    });

    // ➕ 新增欄位 (Column)
    document.getElementById("add-col-btn").addEventListener("click", () => {
      const name = prompt("請輸入新欄位名稱 (例如：SHINY, MUTATED)：");
      if (!name) return;
      const isBoolean = confirm("該欄位類型是否為「勾選框 (是/否)」？\n[按確定] 勾選方塊\n[按取消] 數字計數器");
      
      const colKey = "col_" + Date.now();
      customColumns.push({
        key: colKey,
        name: name,
        type: isBoolean ? "boolean" : "number"
      });

      saveData();
    });

    // 🗑️ 刪除自訂欄位
    document.getElementById("del-col-btn").addEventListener("click", () => {
      if (customColumns.length === 0) return alert("目前沒有自訂欄位可刪除！");
      const names = customColumns.map((c, i) => `${i + 1}. ${c.name}`).join("\n");
      const indexStr = prompt(`請輸入要刪除的欄位編號：\n${names}`);
      const index = parseInt(indexStr) - 1;

      if (!isNaN(index) && index >= 0 && index < customColumns.length) {
        const removed = customColumns.splice(index, 1)[0];
        Object.keys(itemsData).forEach(k => {
          if (itemsData[k].extraFields) delete itemsData[k].extraFields[removed.key];
        });
        saveData();
      }
    });

    // ➕ 新增列 (Item)
    document.getElementById("add-item-btn").addEventListener("click", () => {
      const keys = Object.keys(itemsData).map(k => itemsData[k].id);
      const nextId = keys.length > 0 ? Math.max(...keys) + 1 : 1;
      const name = prompt(`請輸入新物品 (ID #${nextId}) 名稱：`, `物品 #${nextId}`);
      if (!name) return;

      itemsData[`item_${nextId}`] = {
        id: nextId,
        name: name,
        rarity: "Common",
        imageUrl: "",
        astral: false,
        astralCount: 0,
        divine: false,
        void: false,
        extraFields: {}
      };
      saveData();
    });

    // 🗑️ 刪除最後一列
    document.getElementById("delete-item-btn").addEventListener("click", () => {
      const keys = Object.keys(itemsData).sort((a, b) => itemsData[a].id - itemsData[b].id);
      if (keys.length === 0) return alert("無物品可刪除！");
      const lastKey = keys[keys.length - 1];
      if (confirm(`確定刪除最後一列 [#${itemsData[lastKey].id} ${itemsData[lastKey].name}] 嗎？`)) {
        delete itemsData[lastKey];
        saveData();
      }
    });

    // 儲存至 Firebase
    function saveData() {
      render();
      setDoc(doc(db, "trackers", "main_tracker"), { 
        items: itemsData,
        customColumns: customColumns
      }, { merge: true });
    }

    // 雲端即時同步
    onSnapshot(doc(db, "trackers", "main_tracker"), (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.data();
        if (data.items) itemsData = data.items;
        if (data.customColumns) customColumns = data.customColumns;
      } else {
        saveData(); // 空資料時自動以本地資料初始化雲端
      }
      render();
    });

    // 管理員認證
    authBtn.addEventListener("click", () => {
      if (auth.currentUser) {
        signOut(auth);
      } else {
        const email = prompt("管理員 Email：");
        const password = prompt("密碼：");
        if (email && password) signInWithEmailAndPassword(auth, email, password).catch(err => alert("失敗：" + err.message));
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.body.classList.remove("read-only");
        document.getElementById("auth-status").innerText = "當前狀態：管理員已登入";
        authBtn.innerText = "登出";
      } else {
        document.body.classList.add("read-only");
        document.getElementById("auth-status").innerText = "當前狀態：瀏覽模式 (唯讀)";
        authBtn.innerText = "管理員登入";
      }
      render();
    });

    // 切換視圖
    document.getElementById("btn-view-table").addEventListener("click", () => {
      document.getElementById("table-view-container").style.display = "block";
      cardContainer.style.display = "none";
    });

    document.getElementById("btn-view-card").addEventListener("click", () => {
      document.getElementById("table-view-container").style.display = "none";
      cardContainer.style.display = "grid";
    });

    searchInput.addEventListener("input", render);
    window.copyRobloxID = () => {
      navigator.clipboard.writeText("1876441").then(() => alert("已複製 ID：1876441"));
    };
  </script>
</body>
</html>
